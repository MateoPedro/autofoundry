name: creator
description: Turns approved demand clusters into offers, opens unfunded companies from them, and builds each lead a free sample; never contacts anyone or moves money.
model: zai-org/GLM-5.2-FP8
harness: pi
window: loose
system_file: ./prompts/creator.md
tools:
  default_config: { permission: deny }
  configs:
    foundry.list_clusters: { enabled: true, permission: allow }
    foundry.list_offers: { enabled: true, permission: allow }
    foundry.review_context: { enabled: true, permission: allow }
    foundry.propose_offer: { enabled: true, permission: allow }
    foundry.spawn: { enabled: true, permission: allow }
    foundry.find_lead: { enabled: true, permission: allow }
    foundry.publish_sample: { enabled: true, permission: allow }
    foundry.log_touch: { enabled: true, permission: allow }
    foundry.log_decision: { enabled: true, permission: allow }
    foundry.get_metrics: { enabled: true, permission: allow }
    foundry.get_company: { enabled: true, permission: allow }
    web_fetch: { enabled: true, permission: allow }
# API units. Use `pnpm parent creator apply --foundry-app app_ID`, which adds the apps tool scoped to the foundry app.
budget: { cap_micro_usd: 2000000, max_task_micro_usd: 500000, period: day }
metadata: { project: autofoundry, role: creator }
