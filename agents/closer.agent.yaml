name: closer
description: Answers every email to the shared inbox and delivers the product to customers who pay, for every company; never contacts new leads, funds or builds.
model: zai-org/GLM-5.2-FP8
harness: pi
# Replies wake the Closer the moment they arrive; immediate keeps the answer from queueing.
window: immediate
system_file: ./prompts/closer.md
tools:
  default_config: { permission: deny }
  configs:
    foundry.find_lead: { enabled: true, permission: allow }
    foundry.get_company: { enabled: true, permission: allow }
    foundry.log_touch: { enabled: true, permission: allow }
    foundry.checkout_link: { enabled: true, permission: allow }
    foundry.publish_sample: { enabled: true, permission: allow }
    foundry.dismiss_inbound: { enabled: true, permission: allow }
    foundry.read_inbound: { enabled: true, permission: allow }
    email.inboxes: { enabled: true, permission: allow }
    email.send: { enabled: true, permission: allow }
# API units. Use `pnpm parent closer apply --foundry-app app_ID`, which adds the apps tool scoped to the foundry app.
budget: { cap_micro_usd: 10000000, max_task_micro_usd: 300000, period: day }
metadata: { project: autofoundry, role: closer }
