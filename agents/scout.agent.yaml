name: scout
description: Finds business demand and records evidence; never contacts anyone or chooses an offer.
model: zai-org/GLM-5.2-FP8
harness: pi
window: loose
system_file: ./prompts/scout.md
output_schema_file: ./scout-output.schema.json
structured_output_required: true
tools:
  default_config: { permission: deny }
  configs:
    data_search: { enabled: true, permission: allow }
    data_describe: { enabled: true, permission: allow }
    data_run: { enabled: true, permission: allow }
    web_search: { enabled: true, permission: allow }
    web_fetch: { enabled: true, permission: allow }
# API units. Use `pnpm scout apply`; CLI 1.0.3's file parser expects USD instead.
budget: { cap_micro_usd: 3000000, max_task_micro_usd: 500000, period: day }
metadata: { project: autofoundry, role: scout }
