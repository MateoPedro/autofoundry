name: outreach
description: Sends each lead its company's two approved messages from the shared inbox, for every active company; never answers replies, funds or builds.
model: zai-org/GLM-5.2-FP8
harness: pi
window: loose
system_file: ./prompts/outreach.md
tools:
  default_config: { permission: deny }
  configs:
    foundry.find_lead: { enabled: true, permission: allow }
    foundry.get_company: { enabled: true, permission: allow }
    foundry.log_touch: { enabled: true, permission: allow }
    email.inboxes: { enabled: true, permission: allow }
    email.send: { enabled: true, permission: allow }
    browser: { enabled: true, permission: allow, config: { allow_writes: true } }
# API units. Use `pnpm parent outreach apply --foundry-app app_ID`, which adds the apps tool scoped to the foundry app.
budget: { cap_micro_usd: 5000000, max_task_micro_usd: 300000, period: day }
metadata: { project: autofoundry, role: outreach }
